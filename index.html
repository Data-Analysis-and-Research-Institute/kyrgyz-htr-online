<!doctype html>
<html lang="ky" data-title="title.index">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrgyz Handwriting Recognition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1 data-i18n="title.index">Кыргызча кол жазма таануу</h1>
    <nav><a href="index.html" class="active" data-i18n="nav.recognize">Таануу</a><a href="page.html" data-i18n="nav.page">Барак</a><a href="collect.html" data-i18n="nav.contribute">Маалымат берүү</a><a href="validate.html" data-i18n="nav.validate">Текшерүү</a></nav>
  </div>
</header>
<main>
  <div class="card">
    <div class="tabs">
      <button id="tab-draw" class="selected" data-i18n="tab.draw">✍️ Жазуу</button>
      <button id="tab-photo" data-i18n="tab.photo">📷 Сүрөт</button>
    </div>

    <section id="pane-draw">
      <canvas id="draw" class="draw" aria-label="Writing area"></canvas>
      <div class="row">
        <span class="muted" data-i18n="brush">Калем:</span>
        <button data-preset="pen" class="selected" data-i18n="brush.pen">Калем</button>
        <button data-preset="brush" data-i18n="brush.brush">Кисть</button>
        <button data-preset="ink" data-i18n="brush.ink">Сыя</button>
        <span class="spacer"></span>
        <button id="undo" data-i18n="undo">↶ Артка</button>
        <button id="clear" data-i18n="clear">Тазалоо</button>
      </div>
      <p class="muted" data-i18n="idx.drawHint"></p>
    </section>

    <section id="pane-photo" hidden>
      <input type="file" id="file" accept="image/*" capture="environment">
      <p class="muted" data-i18n="idx.photoHint"></p>
      <canvas id="photo" class="photo" hidden></canvas>
      <div class="row"><button id="recognize-photo" class="primary" disabled data-i18n="recognize">Таануу</button></div>
    </section>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0"><b data-i18n="idx.examples">Мисалдар</b><span class="muted" data-i18n="idx.examplesHint"></span></div>
    <div class="examples" id="examples"></div>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0">
      <label class="switch"><input type="checkbox" id="use-lexicon" checked> <span data-i18n="lexicon">Сөздүк менен оңдоо</span></label>
      <span class="muted" id="mode-note"></span>
    </div>
    <div class="muted" id="status"></div>
    <div class="result" id="result"></div>
    <div class="muted" id="expected"></div>
    <ul class="alts" id="alts"></ul>
    <div class="row"><span class="muted" data-i18n="idx.modelInput">Моделдин кириши:</span><canvas id="preview" class="preview"></canvas><span class="muted" id="timing"></span></div>
  </div>

  <div class="card muted">
    <span data-i18n-html="idx.about"></span>
    <span data-i18n="idx.accLabel"></span> <span id="acc"></span>.
  </div>
</main>
<footer data-i18n="idx.footer"></footer>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script src="js/preprocess.js"></script>
<script src="js/decoder.js"></script>
<script src="js/brush.js"></script>
<script src="js/recognizer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
