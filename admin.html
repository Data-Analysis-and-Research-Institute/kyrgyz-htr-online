<!doctype html>
<html lang="en" data-title="title.admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Kyrgyz HTR Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1 data-i18n="title.admin">Рейтинг (админ)</h1>
    <nav><a href="index.html" data-i18n="nav.recognize">Таануу</a><a href="page.html" data-i18n="nav.page">Барак</a><a href="collect.html" data-i18n="nav.contribute">Маалымат берүү</a><a href="validate.html" data-i18n="nav.validate">Текшерүү</a><a href="admin.html" class="active" data-i18n="nav.admin">Админ</a></nav>
  </div>
</header>
<main>
  <section id="start" class="card">
    <h2 data-i18n="adm.h2"></h2>
    <p data-i18n-html="adm.intro"></p>
    <div class="row"><button id="signin" class="primary" data-i18n="signin">Google менен кирүү</button></div>
    <p class="muted" id="auth-info"></p>
  </section>

  <section id="dash" hidden>
    <div class="card">
      <div class="row" style="margin-top:0">
        <span class="muted" id="who"></span><span class="spacer"></span>
        <label class="muted"><span data-i18n="adm.period"></span>
          <select id="period"><option value="0" data-i18n="adm.all"></option><option value="30" data-i18n="adm.d30"></option><option value="7" data-i18n="adm.d7"></option><option value="1" data-i18n="adm.d1"></option></select></label>
        <button id="reload" data-i18n="adm.reload"></button>
      </div>
      <div class="tiles" id="tiles"></div>
      <p class="muted" id="loaded"></p>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0"><h2 class="h-inline" data-i18n="adm.contributors"></h2><span class="spacer"></span>
        <button data-csv="contributors">CSV</button></div>
      <p class="muted" data-i18n="adm.contribNote"></p>
      <div class="table-wrap"><table class="rank" id="t-contributors"></table></div>
    </div>

    <div class="card">
      <div class="row" style="margin-top:0"><h2 class="h-inline" data-i18n="adm.validators"></h2><span class="spacer"></span>
        <button data-csv="validators">CSV</button></div>
      <p class="muted" data-i18n="adm.valNote"></p>
      <div class="table-wrap"><table class="rank" id="t-validators"></table></div>
    </div>
  </section>
</main>
<footer data-i18n="adm.footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
