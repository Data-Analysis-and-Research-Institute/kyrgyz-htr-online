<!doctype html>
<html lang="ky" data-title="title.validate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrgyz Handwriting Validation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1 data-i18n="title.validate">Текшерүү</h1>
    <nav><a href="index.html" data-i18n="nav.recognize">Таануу</a><a href="page.html" data-i18n="nav.page">Барак</a><a href="collect.html" data-i18n="nav.contribute">Маалымат берүү</a><a href="validate.html" class="active" data-i18n="nav.validate">Текшерүү</a></nav>
  </div>
</header>
<main>
  <section id="start" class="card">
    <h2 data-i18n="val.h2"></h2>
    <p data-i18n="val.intro"></p>
    <div class="row"><button id="signin" class="primary" data-i18n="signin">Google менен кирүү</button></div>
    <p class="muted" data-i18n="val.once"></p>
    <p class="muted" id="auth-info"></p>
  </section>

  <section id="review" class="card" hidden>
    <div class="row" style="margin-top:0">
      <span class="muted" id="src"></span><button id="signout" class="link" data-i18n="signout">Чыгуу</button>
      <span class="spacer"></span><span class="muted" id="progress"></span>
    </div>
    <div id="empty" hidden>
      <p><b data-i18n="val.thanks"></b></p>
      <p class="muted" id="empty-info"></p>
      <div class="row"><button id="recheck" data-i18n="val.recheck"></button></div>
    </div>
    <div class="val-grid" id="sample">
      <div>
        <div class="muted" data-i18n="val.image"></div>
        <img id="img" class="val-img" alt="handwritten sample">
        <div class="row" id="replay-row"><span class="muted" data-i18n="val.replay"></span><button id="replay">▶</button></div>
        <canvas id="strokes" class="val-strokes"></canvas>
      </div>
      <div>
        <table class="val-meta">
          <tr><td class="muted" data-i18n="val.prompt"></td><td id="m-prompt"></td></tr>
          <tr><td class="muted" data-i18n="val.label"></td><td id="m-text" class="val-label"></td></tr>
          <tr><td class="muted" data-i18n="val.model"></td><td id="m-model"></td></tr>
          <tr><td class="muted" data-i18n="val.brush"></td><td id="m-brush"></td></tr>
          <tr><td class="muted" data-i18n="val.votes"></td><td id="m-votes" class="muted"></td></tr>
        </table>
        <div class="val-actions">
          <button data-v="correct" class="primary" data-i18n="v.correct"></button>
          <button data-v="wrong_label" data-i18n="v.wrong"></button>
          <button data-v="illegible" data-i18n="v.illegible"></button>
          <button data-v="not_kyrgyz" data-i18n="v.notky"></button>
          <button data-v="personal_info" data-i18n="v.pii"></button>
          <button id="skip" data-i18n="v.skip"></button>
        </div>
        <div class="row" id="fix-row" hidden>
          <label><span data-i18n="val.fixLabel"></span> <input type="text" id="fix" autocomplete="off" spellcheck="false"></label>
          <button id="fix-save" class="primary" data-i18n="val.fixSave"></button>
        </div>
        <p class="muted" id="status"></p>
      </div>
    </div>
  </section>
</main>
<footer><a href="admin.html" data-i18n="nav.admin">Админ</a> · <span data-i18n="val.keys"></span></footer>

<script src="js/i18n.js"></script>
<script src="js/firebase-config.js"></script>
<script type="module" src="js/validate.js"></script>
</body>
</html>
