<!doctype html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="../index.html" style="width:900px;height:1500px"></iframe>
<pre id="out">START</pre>
<script>
const log = (s) => { document.getElementById('out').textContent += '\n' + s; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById('f').onload = async () => {
  try {
    const w = document.getElementById('f').contentWindow, d = w.document, $ = (id) => d.getElementById(id);
    for (let i = 0; i < 60 && !/Ready/.test($('status').textContent); i++) await sleep(500);
    log('status: ' + $('status').textContent + ' | examples: ' + d.querySelectorAll('#examples button').length);
    const btns = d.querySelectorAll('#examples button');
    for (const k of [0, 6, 8]) {
      if (!$('use-lexicon').checked) $('use-lexicon').click();
      btns[k].click(); await sleep(3000);
      const withLex = $('result').textContent + ' (' + $('expected').textContent + ')';
      $('use-lexicon').click(); await sleep(2500);
      const noLex = $('result').textContent + ' (' + $('expected').textContent + ') | ' + $('status').textContent;
      log(`example ${k + 1}: word list ON -> ${withLex} | OFF -> ${noLex}`);
    }
    $('use-lexicon').click(); await sleep(2500);
    log('switch back on: ' + $('result').textContent + ' | ' + $('mode-note').textContent);
    log('DONE');
  } catch (e) { log('ERROR ' + (e.stack || e)); }
};
</script></body></html>
