<!doctype html>
<html lang="ky" data-title="title.page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kyrgyz Page Recognition</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <h1 data-i18n="title.page">Барак / текст таануу</h1>
    <nav><a href="index.html" data-i18n="nav.recognize">Таануу</a><a href="page.html" class="active" data-i18n="nav.page">Барак</a><a href="collect.html" data-i18n="nav.contribute">Маалымат берүү</a><a href="validate.html" data-i18n="nav.validate">Текшерүү</a></nav>
  </div>
</header>
<main>
  <div class="card">
    <div class="tabs">
      <button id="tab-photo" class="selected" data-i18n="tab.pagePhoto">📷 Барактын сүрөтү</button>
      <button id="tab-draw" data-i18n="tab.sentence">✍️ Сүйлөм жазуу</button>
    </div>
    <section id="pane-photo">
      <input type="file" id="file" accept="image/*">
      <p class="muted" data-i18n="pg.photoHint"></p>
    </section>
    <section id="pane-draw" hidden>
      <canvas id="draw" class="draw page-draw" aria-label="Writing area"></canvas>
      <div class="row">
        <span class="spacer"></span>
        <button id="undo" data-i18n="undo">↶ Артка</button>
        <button id="clear" data-i18n="clear">Тазалоо</button>
        <button id="recognize-draw" class="primary" data-i18n="recognize">Таануу</button>
      </div>
      <p class="muted" data-i18n="pg.drawHint"></p>
    </section>
    <div class="row" style="margin-top:0.5rem">
      <label class="switch"><input type="checkbox" id="use-lexicon" checked> <span data-i18n="lexicon">Сөздүк менен оңдоо</span></label>
    </div>
  </div>

  <div class="card" id="out" hidden>
    <div class="muted" id="status"></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="page-grid">
      <div class="page-view"><canvas id="overlay"></canvas></div>
      <div>
        <div class="row" style="margin-top:0"><b data-i18n="pg.text">Текст</b><span class="spacer"></span><button id="copy" data-i18n="pg.copy">Көчүрүү</button></div>
        <textarea id="text" class="page-text" spellcheck="false"></textarea>
        <p class="muted" data-i18n="pg.clickHint"></p>
        <div id="word-info" class="muted"></div>
      </div>
    </div>
  </div>

  <div class="card muted" data-i18n-html="pg.how"></div>
</main>
<footer>Kyrgyz HTR · <a href="https://github.com/Data-Analysis-and-Research-Institute/kyrgyz-htr-online">source</a></footer>

<script src="js/i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/ort.min.js"></script>
<script src="js/preprocess.js"></script>
<script src="js/decoder.js"></script>
<script src="js/brush.js"></script>
<script src="js/recognizer.js"></script>
<script src="js/page.js"></script>
<script src="js/page-app.js"></script>
</body>
</html>
